<meta property="og:image" content="https://ghonem100.github.io/R/og.jpg">

<!-- تطبيق على الموبايل -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BESTIE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&family=Lalezar&family=Orbitron:wght@500;700;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-level="boot">
<canvas id="bg"></canvas>
<div class="vignette"></div>

<header class="hud" id="hud">
  <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
  <div class="hud-mid">
    <div class="hud-level"><span class="en" id="hudCode">LEVEL 01</span> · <span class="en" id="hudTitle">THE INVITATION</span></div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="hud-score" id="hudScore"><span class="en">SCORE</span><b id="score">0</b></div>
  <button class="icon-btn" id="soundBtn" aria-label="الصوت">🔊</button>
</header>

<main id="stage"></main>


<div class="intro" id="intro">
  <div class="intro-code en" id="introCode">LEVEL 01</div>
  <div class="intro-title en" id="introTitle">THE INVITATION</div>
  <div class="intro-ar" id="introAr">الدعوة</div>
  <div class="intro-line"></div>
</div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<div class="scan"></div>

<!-- ✏️ كل التعديلات الشخصية في config.js -->
<script src="config.js"></script>
<script src="game.js"></script>
</body>
